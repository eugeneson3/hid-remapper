name: build-feather
on:
  push:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - '.github/workflows/build-feather.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      SOURCE_DATE_EPOCH: '1788652800'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install ARM and host compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Verify v2 transport and v3 mapping
        run: |
          python3 tests/test_v2_transport.py
          python3 tests/test_hid_reliability.py
          python3 tests/test_v3_mapping.py
      - name: Build Feather v3
        run: |
          cmake -S firmware -B build-v3 -DPICO_BOARD=feather_host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-v3 --target remapper -j2
          mkdir artifacts
          cp build-v3/remapper.uf2 artifacts/firmware_nightly_v3.uf2
      - uses: actions/upload-artifact@v7
        with:
          name: feather-nightly-v3
          path: artifacts/firmware_nightly_v3.uf2
