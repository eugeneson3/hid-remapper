name: build-feather
on:
  push:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'tools/patch-tinyusb.py'
      - '.github/workflows/build-feather.yml'
  workflow_dispatch:
defaults:
  run:
    shell: bash --noprofile --norc -x -e -o pipefail {0}
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install compiler, libraries and tools
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib srecord
      - name: Patch pinned TinyUSB and test HID reliability
        run: |
          python3 tools/patch-tinyusb.py
          python3 tests/test_hid_reliability.py
      - name: Build Feather RP2040 USB Host firmware
        run: |
          mkdir build-feather
          cd build-feather
          PICO_BOARD=feather_host cmake ..
          make remapper
          cd ..
          mkdir artifacts
          mv build-feather/remapper.uf2 artifacts/remapper_feather.uf2
        working-directory: ./firmware
      - uses: actions/upload-artifact@v7
        with:
          name: remapper-feather
          path: firmware/artifacts/remapper_feather.uf2
